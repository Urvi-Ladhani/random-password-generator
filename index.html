<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>RANDOM PASSWORD GENERATOR</h1>
        <p>Start password generation</p>
        <label for="length">Length:</label>
        <input id="length" type="number"><br>

        <label for="lowercase">Lowercase letter:</label>
        <input id="lowercase" type="checkbox"><br>

        <label for="uppercase">Uppercase letter:</label>
        <input id="uppercase" type="checkbox"><br>

        <label for="number">Number:</label>
        <input id="number" type="checkbox"><br>

        <label for="symbol">Symbol:</label>
        <input id="symbol" type="checkbox"><br>

        <button type="button" id="generate">Generate</button>
        <p id="result"></p>

        <button type="button" id="regen">Regenerate</button>

        

        <script src="index.js"></script>

    </form>
</body>
</html>
